# /etc/nginx/sites-available/wilayah
# Static hosting for the Wilayah Indonesia API (province/city/district/village JSON) + demo + docs.
# Live: https://wilayah.darisdzakwanhoesien.site/
#
# First install:
#   sudo ln -sfn /etc/nginx/sites-available/wilayah /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d wilayah.darisdzakwanhoesien.site --agree-tos --redirect

server {
    server_name wilayah.darisdzakwanhoesien.site;

    root /var/www/wilayah;
    index index.html;

    access_log /var/log/nginx/wilayah.access.log;
    error_log  /var/log/nginx/wilayah.error.log;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # JSON API files: allow cross-origin fetches from any site's dropdown form.
    location /api/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wilayah.darisdzakwanhoesien.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wilayah.darisdzakwanhoesien.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = wilayah.darisdzakwanhoesien.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name wilayah.darisdzakwanhoesien.site;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
